spring.application.name=api-gateway
server.port=8765

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Routes Configuration (Updated for Spring Cloud Gateway 2025.0.0)
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-management-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**, /api/notifications/**

spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://course-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/courses/**, /api/chapters/**, /api/lessons/**, /api/enrollments/**

spring.cloud.gateway.server.webflux.routes[2].id=question-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://question-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/questions/**

spring.cloud.gateway.server.webflux.routes[3].id=quiz-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://quiz-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/quizzes/**
